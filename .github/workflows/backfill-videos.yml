name: Backfill channel videos
# নতুন চ্যানেলের পুরো (পুরোনো) ভিডিও তালিকা নামায় — tools/backfill-videos.cjs।
# update-videos.yml শুধু সর্বশেষ ১৫টি দেখে; এই ওয়ার্কফ্লো চ্যানেলের সব আপলোড ধরে।
# - workflow_dispatch: হাতে চালান (channel/limit ইচ্ছেমতো); রান বারবার চালালে বাকিটা যোগ হয়।
# - push (arena/**): স্ক্রিপ্ট বদলালে একবার চলে (এই রিপোতে workflow_dispatch করার অনুমতি নেই, তাই এটিই উপায়)।
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'শুধু একটি চ্যানেল (handle/ID/নাম) — খালি রাখলে সব backfill:true চ্যানেল'
        required: false
        default: ''
      limit:
        description: 'এক রানে সর্বোচ্চ কতটি নতুন ভিডিও'
        required: false
        default: '4000'
      tab:
        description: 'videos | shorts'
        required: false
        default: 'videos'
  push:
    branches: ['arena/**']
    paths: ['tools/backfill-videos.cjs', 'tools/probe-videos.cjs', '.github/workflows/backfill-videos.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: backfill-videos-b-${{ github.ref_name }}  # বি-গ্রুপ: পুরোনো (ধীর) রান আটকে থাকলেও এটি সাথে সাথে শুরু হয়
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe which routes work from this runner
        env:
          CH: UCc6cxJCSSaLxd4JE_GHxsEA
        run: |
          node tools/probe-videos.cjs 2>&1 | tee tools/probe-report.txt
          echo "--- yt-dlp ---" >> tools/probe-report.txt
          if pip install -q yt-dlp >/dev/null 2>&1; then
            yt-dlp --version >> tools/probe-report.txt 2>&1
            {
              echo "dates (3 latest):"
              yt-dlp --no-warnings --skip-download --print "%(id)s|%(upload_date)s|%(title).40s" \
                "https://www.youtube.com/channel/$CH/videos" --playlist-end 3 2>&1 | tail -6
              echo "flat listing:"
              yt-dlp --no-warnings --flat-playlist --print "%(id)s" \
                "https://www.youtube.com/channel/$CH/videos" > /tmp/flat.txt 2>/tmp/flat.err || true
              echo "  lines: $(wc -l < /tmp/flat.txt) · first: $(head -1 /tmp/flat.txt) · last: $(tail -1 /tmp/flat.txt)"
              echo "  err: $(tail -2 /tmp/flat.err)"
            } >> tools/probe-report.txt 2>&1
          else
            echo "pip install yt-dlp failed" >> tools/probe-report.txt
          fi
          cat tools/probe-report.txt
      - name: Walk the channel and add missing videos
        env:
          BACKFILL_CHANNEL: ${{ inputs.channel }}
          BACKFILL_LIMIT: ${{ inputs.limit || '4000' }}
          BACKFILL_TAB: ${{ inputs.tab || 'videos' }}
        run: |
          node tools/backfill-videos.cjs --minutes 100 2>&1 | tee tools/backfill-report.txt
          exit "${PIPESTATUS[0]}"
      - name: Commit new videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-videos.json stats.json tools/video-channels.json tools/backfill-report.txt tools/probe-report.txt
          if git diff --cached --quiet; then
            echo "নতুন কিছু নেই"
            exit 0
          fi
          git commit -q -m "Backfill channel videos (automated)"
          git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort; git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}"; }
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
      - name: Ask GitHub Pages to publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
