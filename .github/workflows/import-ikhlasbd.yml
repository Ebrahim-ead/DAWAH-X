name: Import ikhlasbd texts
# মাসিক আল-ইখলাছ (ikhlasbd.com) থেকে লেখা ও ফতোয়া — tools/import-ikhlasbd.cjs
# প্রথমে --discover (তালিকা), তারপর ব্যাচে ব্যাচে লেখা আনা; আগে আনা লেখা আর আনা হয় না।
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe | discover | import'
        required: false
        default: 'import'
      limit:
        description: 'এক রানে সর্বোচ্চ কতটি লেখা'
        required: false
        default: '300'
  push:
    branches: ['arena/**']
    paths: ['tools/import-ikhlasbd.cjs', '.github/workflows/import-ikhlasbd.yml', 'tools/ik-request']
permissions:
  contents: write
concurrency:
  group: import-ikhlasbd
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --prefix /tmp/imp cheerio@1.0.0
      - name: Resolve mode and limit
        # dispatch-এ ইনপুট না থাকলে tools/ik-request ({"mode":"import","limit":1200}) থেকে নেওয়া হয়
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_LIMIT: ${{ inputs.limit }}
        run: |
          node -e '
            const fs = require("fs");
            let req = {};
            try { req = JSON.parse(fs.readFileSync("tools/ik-request", "utf8")); } catch (e) {}
            const mode = process.env.IN_MODE || req.mode || "probe";
            const limit = String(process.env.IN_LIMIT || req.limit || 300);
            fs.appendFileSync(process.env.GITHUB_ENV, "IK_MODE_EFF=" + mode + "\nIK_LIMIT_EFF=" + limit + "\n");
            console.log("mode=" + mode + " limit=" + limit);
          '
      - name: Discover / probe / import
        env:
          NODE_PATH: /tmp/imp/node_modules
        run: |
          echo "mode=$IK_MODE_EFF · limit=$IK_LIMIT_EFF" | tee tools/ik-report.txt
          # রান ব্যর্থ হলেও রিপোর্ট কমিট হয়, যাতে কারণটা পড়া যায়
          if [ "$IK_MODE_EFF" = "discover" ] || [ "$IK_MODE_EFF" = "probe" ]; then
            node tools/import-ikhlasbd.cjs --discover 2>&1 | tee -a tools/ik-report.txt || echo "discover failed: $?" | tee -a tools/ik-report.txt
          fi
          if [ "$IK_MODE_EFF" = "probe" ]; then
            node tools/import-ikhlasbd.cjs --probe 6 2>&1 | tee -a tools/ik-report.txt || echo "probe failed: $?" | tee -a tools/ik-report.txt
          fi
          if [ "$IK_MODE_EFF" = "import" ]; then
            node tools/import-ikhlasbd.cjs --limit "$IK_LIMIT_EFF" --minutes 300 2>&1 | tee -a tools/ik-report.txt || echo "import failed: $?" | tee -a tools/ik-report.txt
          fi
          exit 0
      - name: Rebuild search index, related lists and share pages
        if: env.IK_MODE_EFF == 'import'
        run: node --max-old-space-size=4096 tools/build-site-data.cjs
      - name: Refresh series, topics and sitemaps
        if: env.IK_MODE_EFF == 'import'
        run: |
          node tools/build-series.cjs
          node tools/build-topics.cjs
          node tools/build-discovery.cjs
          node tools/build-faq.cjs
          node tools/build-sitemaps.cjs
      - name: Refresh site totals
        if: env.IK_MODE_EFF == 'import'
        run: node tools/build-stats.cjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- source-data.json source-index.json 'source-??-*.json' recent-data.json sources.html recent.html faq.html texts search rel s stats.json series.json series.html 'series-*.html' 'topic-*.html' topics.html index.html 'sitemap-*.xml' sitemap.xml robots.txt tools/ik-ids.json tools/ik-report.txt 2>/dev/null || true
          if git diff --cached --quiet; then echo "নতুন কিছু নেই"; exit 0; fi
          git commit -q -m "Import ikhlasbd texts (automated)"
          for i in 1 2 3 4; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}" >/dev/null 2>&1 || git rebase --abort >/dev/null 2>&1 || true
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then echo "pushed (try $i)"; break; fi
            sleep 20
          done
