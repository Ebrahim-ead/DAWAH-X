name: Inspect HadithBD source
on:
  push:
    branches: ['arena/5adb3b96-dawah-x']
    paths: ['.github/workflows/hadithbd-temporary.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/5adb3b96-dawah-x
      - name: Inspect HTTP responses
        run: |
          for url in https://www.hadithbd.com/ https://www.hadithbd.com/hadith/daif-jal-hadith/1 https://hadithbd.com/hadith/daif-jal-hadith/1; do
            for agent in 'curl/8.5.0' 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'; do
              curl -L -sS --max-time 45 --compressed -A "$agent" -D /tmp/hdr -o /tmp/out -w 'http=%{http_code} size=%{size_download} redirects=%{num_redirects} final=%{url_effective}\n' "$url" || true
              head -30 /tmp/hdr; head -c 400 /tmp/out || true; echo
            done
          done
