name: Inspect HadithBD source
on:
  push:
    branches: ['arena/5adb3b96-dawah-x']
    paths: ['.github/workflows/hadithbd-temporary.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/5adb3b96-dawah-x
      - name: Inspect permitted public pages
        run: |
          set -eu
          for page in 1 2 2000 section/1; do
            file="$(echo "$page" | tr / -)"
            curl -fLsS --max-time 90 "https://www.hadithbd.com/hadith/daif-jal-hadith/$page" | gzip -9 > "tools/hadithbd-inspect-$file.html.gz"
            echo "$file $(gzip -dc "tools/hadithbd-inspect-$file.html.gz" | wc -c)"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/hadithbd-inspect-*.html.gz
          git commit -m 'Inspect source formatting for permitted hadith collection'
          git push origin HEAD:arena/5adb3b96-dawah-x
