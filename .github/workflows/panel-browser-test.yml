name: Temporary panel browser check
on:
  push:
    branches: [arena/0e8e7543-dawah-x]
    paths: ['style.css', 'fatwa.html', 'tools/panel-browser-test.cjs', '.github/workflows/panel-browser-test.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix /tmp/paneltest playwright-core
      - run: |
          git show 7dd2fc974422ee0bebe3cdb29e09684f0cb469b8:style.css >/tmp/panel-old.css
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/panel-http.log 2>&1 &
          NODE_PATH=/tmp/paneltest/node_modules node tools/panel-browser-test.cjs
