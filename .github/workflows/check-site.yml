name: Site check
# প্রতিটি push ও pull request-এ সাইটের ভেতরের ভাঙা লিংক, sw.js-এর প্রি-ক্যাশ, সাইটম্যাপ,
# ক্যাটালগের সংখ্যা, feed.xml ইত্যাদি যাচাই করে — সমস্যা থাকলে রান ফেল করে।
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate the site
        run: |
          node tools/check-site.cjs
          node tools/run-tests.cjs
          TZ=Pacific/Honolulu node tests/prayer-times.cjs
          TZ=Pacific/Kiritimati node tests/prayer-times.cjs
  scripture-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install reader test dependency
        run: npm install --prefix "$RUNNER_TEMP/scripture-reader" jsdom@24.1.3
      - name: Exercise real reader assets under a project subpath
        run: |
          NODE_PATH="$RUNNER_TEMP/scripture-reader/node_modules" node tools/check-scripture-reader.cjs
          NODE_PATH="$RUNNER_TEMP/scripture-reader/node_modules" node tools/check-islamic-books-reader.cjs
  worker-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workerd test runtime
        run: npm install --prefix "$RUNNER_TEMP/worker-runtime" miniflare@3.20250718.3
      - name: Test actual Worker fetch behavior
        run: NODE_PATH="$RUNNER_TEMP/worker-runtime/node_modules" node tools/check-worker-runtime.cjs
  guidance-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser test dependencies
        run: npm install --prefix "$RUNNER_TEMP/guidance-browser" playwright-core@1.56.1 pngjs@7.0.0
      - name: Check daily reading contrast in Chromium
        run: NODE_PATH="$RUNNER_TEMP/guidance-browser/node_modules" node tools/check-guidance-browser.cjs
  responsive-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser test dependencies
        run: npm install --prefix "$RUNNER_TEMP/responsive-browser" playwright-core@1.56.1
      - name: Check responsive interactions in Chromium
        run: NODE_PATH="$RUNNER_TEMP/responsive-browser/node_modules" TEST_ARTIFACT_DIR="$RUNNER_TEMP/responsive-results" node tools/check-responsive-browser.cjs
      - name: Check scripture reader layouts in Chromium
        run: NODE_PATH="$RUNNER_TEMP/responsive-browser/node_modules" node tools/check-scripture-responsive.cjs
      - name: Check assistant on scripture readers in Chromium
        run: NODE_PATH="$RUNNER_TEMP/responsive-browser/node_modules" node tools/check-reader-assistant-browser.cjs
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-browser-failure
          path: ${{ runner.temp }}/responsive-results/
          if-no-files-found: ignore
          retention-days: 7
