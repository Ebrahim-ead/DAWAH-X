name: Site check
# প্রতিটি push ও pull request-এ সাইটের ভেতরের ভাঙা লিংক, sw.js-এর প্রি-ক্যাশ, সাইটম্যাপ,
# ক্যাটালগের সংখ্যা, feed.xml ইত্যাদি যাচাই করে — সমস্যা থাকলে রান ফেল করে।
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate the site
        run: |
          node tools/check-site.cjs
          node tests/video-audit.cjs
          node tests/video-audit-integration.cjs
          node tests/video-blocklist-integration.cjs
          node tests/home-sections.cjs
          node tests/fatwa-panel.cjs
          node tests/text-date.cjs
          node tests/new-text-import.cjs
          node tests/source-shards.cjs
          node tests/sw-precache.cjs
