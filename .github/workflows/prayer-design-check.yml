name: Temporary prayer design check
on:
  push:
    branches: [arena/313492c4-dawah-x]
    paths: ['index.html', 'style.css', 'tools/prayer-design-check.cjs', '.github/workflows/prayer-design-check.yml']
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix /tmp/prayercheck playwright-core
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/prayer-http.log 2>&1 &
          NODE_PATH=/tmp/prayercheck/node_modules node tools/prayer-design-check.cjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/prayer-design-mobile.png tools/prayer-design-desktop.png
          git commit -m 'Save temporary design screenshots'
          git push origin HEAD:${GITHUB_REF_NAME}
