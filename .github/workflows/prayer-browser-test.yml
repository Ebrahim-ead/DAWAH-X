name: Temporary prayer widget browser check
on:
  push:
    branches: [arena/10e439e8-dawah-x]
    paths: ['index.html', 'prayer-times.js', 'style.css', 'tools/prayer-browser-test.cjs', '.github/workflows/prayer-browser-test.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix /tmp/prayertest playwright-core
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/prayer-http.log 2>&1 &
          NODE_PATH=/tmp/prayertest/node_modules node tools/prayer-browser-test.cjs
