name: Assistant live smoke test
# Manual only: sends three fixed, public sample questions to production and
# incurs Workers AI inference costs. No user chats, training or writes.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test deployed site search and Worker
        run: node tools/check-assistant-live.cjs
