name: Assistant live smoke test
# Opt-in only: sends fixed, public sample questions to production and
# incurs Workers AI inference costs. No user chats, training or writes.
on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[assistant-live-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test deployed site search and Worker
        env:
          ASSISTANT_LIVE_FOCUS: ${{ contains(github.event.head_commit.message, '[assistant-focus-check]') && 'camel' || '' }}
          ASSISTANT_PREVIEW: ${{ contains(github.event.head_commit.message, '[assistant-preview-check]') && 'true' || 'false' }}
          PREVIEW_BRANCH: ${{ github.ref_name }}
        run: node tools/check-assistant-live.cjs
      - name: Save fixed public questions and responses for manual source review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-live-review
          path: assistant-live-review.json
          if-no-files-found: warn
          retention-days: 7
