name: One-time performance measurement
on:
  push:
    branches: ['arena/**']
    paths: ['tools/perf-probe.cjs']
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --prefix /tmp/perf playwright-core
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          NODE_PATH=/tmp/perf/node_modules node tools/perf-probe.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/perf-probe-result.json
          git commit -m "Measure page performance"
          git push origin "HEAD:${GITHUB_REF_NAME}"
