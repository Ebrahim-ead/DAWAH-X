name: Update video list
# চ্যানেলগুলোর নতুন আপলোড youtube-videos.json-এ যোগ করে (tools/update-videos.cjs)।
# - schedule: প্রতি ৫ মিনিটে (GitHub-এর সর্বনিম্ন সময়সীমা ৫ মিনিট; ব্যস্ত থাকলে রান দেরি হতে পারে)।
#   স্লটগুলো ঘণ্টার শুরুর মিনিটে (0) রাখা হয়নি — তখন GitHub-এ ভিড় সবচেয়ে বেশি।
# - workflow_dispatch: Actions ট্যাব থেকে হাতে চালানো যায় ("Run workflow") — এক চাপে হালনাগাদ।
# - push (arena/**): স্ক্রিপ্ট বা চ্যানেলের তালিকা বদলালে সেই শাখাতেই একবার চলে — বদল পরীক্ষা করার জন্য।
# - repository_dispatch (youtube-upload): YouTube-এর WebSub পুশ (tools/websub-worker.js) ভিডিও প্রকাশের
#   সাথে সাথেই এই রানটি চালু করতে পারে — তখন ক্রনের অপেক্ষা করতে হয় না।
# এই রানে ব্রাউজার লাগে না; প্রতি ৬ ঘণ্টায় পুরোনো ভিডিওও সার্ভার-পাশে পালাক্রমে যাচাই করা হয়।
run-name: ভিডিও তালিকা হালনাগাদ
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
    - cron: '15 */6 * * *'  # পুরোনো ভিডিওর উপলভ্যতা পালাক্রমে যাচাই
  workflow_dispatch:
  repository_dispatch:
    types: [youtube-upload]
  push:
    branches: ['arena/**']
    paths: ['tools/update-videos.cjs', 'tools/video-channels.json', '.github/workflows/update-videos.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: update-videos-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # শাখার সর্বশেষ অবস্থা
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Look for new uploads
        run: node tools/update-videos.cjs
      - name: Audit old videos
        if: github.event.schedule == '15 */6 * * *'
        run: node tools/audit-videos.cjs
      - name: Refresh recent publications and feed
        run: |
          node tools/build-discovery.cjs
          node tools/build-feed.cjs
      - name: Commit new videos
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- youtube-videos.json stats.json tools/video-channels.json recent-data.json source-data.json source-index.json 'source-??-*.json' sources.html recent.html feed.xml cross-links.json app.js
          if [ -f tools/video-audit-state.json ]; then git add tools/video-audit-state.json; fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "নতুন কিছু নেই"
            exit 0
          fi
          git commit -q -m "Add new videos (automated)"
          git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort; git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}"; }
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # স্বয়ংক্রিয় কমিটের পরে GitHub Pages নিজে থেকে নতুন করে প্রকাশ না করলেও যেন সাইটে আসে
      - name: Ask GitHub Pages to publish
        if: steps.commit.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
