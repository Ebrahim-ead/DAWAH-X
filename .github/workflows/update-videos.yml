name: Update video list
# চ্যানেলগুলোর নতুন আপলোড youtube-videos.json-এ যোগ করে (tools/update-videos.cjs)।
# - schedule: মূল শাখায় (main) প্রতি আধা ঘণ্টায়; GitHub ব্যস্ত থাকলে কিছুটা দেরি হতে পারে।
# - workflow_dispatch: Actions ট্যাব থেকে হাতে চালানো যায় ("Run workflow")।
# - push (arena/**): স্ক্রিপ্ট বা চ্যানেলের তালিকা বদলালে সেই শাখাতেই একবার চলে — বদল পরীক্ষা করার জন্য।
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['tools/update-videos.cjs', 'tools/video-channels.json', '.github/workflows/update-videos.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: update-videos-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # শাখার সর্বশেষ অবস্থা
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Look for new uploads
        run: node tools/update-videos.cjs
      - name: Commit new videos
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-videos.json tools/video-channels.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "নতুন কিছু নেই"
            exit 0
          fi
          git commit -q -m "Add new videos (automated)"
          git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort; git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}"; }
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # স্বয়ংক্রিয় কমিটের পরে GitHub Pages নিজে থেকে নতুন করে প্রকাশ না করলেও যেন সাইটে আসে
      - name: Ask GitHub Pages to publish
        if: steps.commit.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
