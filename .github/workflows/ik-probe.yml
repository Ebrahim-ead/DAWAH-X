name: Probe ikhlasbd structure
on:
  push:
    branches: ['arena/**']
    paths: ['tools/ik-probe.cjs', '.github/workflows/ik-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-data-jobs]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/ik-probe.cjs
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ikhlasbd-probe-report
          path: tools/ik-probe-report.txt
          if-no-files-found: ignore
          retention-days: 30
