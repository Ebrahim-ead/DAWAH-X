name: Temporary live book reader check
on:
  push:
    branches: ['arena/55c2ae55-dawah-x']
    paths: ['.github/workflows/books-live-temporary.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/books-browser" playwright-core@1.56.1
      - name: Render real source PDF from the site's reader
        run: NODE_PATH="$RUNNER_TEMP/books-browser/node_modules" node tools/check-books-live.cjs
