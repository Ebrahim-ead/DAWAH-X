name: Source diagnostic
on:
  push:
    branches: ['arena/**']
    paths: ['tools/source-diagnostic.cjs']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --prefix /tmp/imp cheerio@1.0.0
      - run: NODE_PATH=/tmp/imp/node_modules node tools/source-diagnostic.cjs
