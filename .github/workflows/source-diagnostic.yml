name: Source diagnostic
on:
  push:
    branches: ['arena/**']
    paths: ['tools/source-diagnostic.cjs']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --prefix /tmp/imp cheerio@1.0.0
      - run: NODE_PATH=/tmp/imp/node_modules node tools/source-diagnostic.cjs > tools/source-diagnostic-report.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/source-diagnostic-report.txt
          git commit -m "Record one-time source diagnostic"
          git push origin "HEAD:${GITHUB_REF_NAME}"

