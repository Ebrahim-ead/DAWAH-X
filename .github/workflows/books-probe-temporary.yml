name: Temporary books source inventory
on:
  push:
    branches: ['arena/55c2ae55-dawah-x']
    paths: ['.github/workflows/books-probe-temporary.yml', 'tools/inspect-islamic-books.py']
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Collect only catalogue fields and sample PDF response headers
        run: python3 tools/inspect-islamic-books.py
      - name: Save diagnostic on current branch
        if: always()
        run: |
          test -f tools/islamic-books-source.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/islamic-books-source.json
          git commit -m 'Record book catalogue source inventory [skip-data-jobs]'
          git push origin HEAD:${{ github.ref_name }}
