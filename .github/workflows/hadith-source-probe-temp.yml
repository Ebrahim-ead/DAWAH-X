name: Temporary hadith source availability probe
on:
  push:
    paths:
      - '.github/workflows/hadith-source-probe-temp.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check alternative public sources
        shell: bash
        run: |
          set -u
          mkdir -p .source-probe
          urls=(
            'https://www.hadithbd.net/hadith/fullbook/?pageNum_mainHadith=172&totalRows_mainHadith=3542&book=21'
            'https://hadithbd.net/hadith/fullbook/?pageNum_mainHadith=109&totalRows_mainHadith=3902&book=27'
            'https://www.tauhiderdak.com/'
          )
          : > .source-probe/result.txt
          for url in "${urls[@]}"; do
            echo "URL $url" >> .source-probe/result.txt
            curl --silent --show-error --location --max-time 25 --output /tmp/probe-body --write-out 'status=%{http_code} effective=%{url_effective} bytes=%{size_download}\n' "$url" >> .source-probe/result.txt 2>&1 || echo 'curl failed' >> .source-probe/result.txt
            if test -f /tmp/probe-body; then head -c 180 /tmp/probe-body | tr '\n' ' ' >> .source-probe/result.txt; echo >> .source-probe/result.txt; rm /tmp/probe-body; fi
          done
          git config user.name github-actions\[bot\]
          git config user.email 41898282+github-actions\[bot\]@users.noreply.github.com
          git add .source-probe/result.txt
          git commit -m 'Temporary source availability results'
          git push origin HEAD:${{ github.ref_name }}
