name: Temporary hadith source availability probe
on:
  push:
    paths:
      - '.github/workflows/hadith-source-probe-temp.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect one public source page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .source-probe
          curl --fail --silent --show-error --location --max-time 40 'https://www.tauhiderdak.com/%E0%A6%A6%E0%A6%BE%E0%A6%B0%E0%A7%87%E0%A6%AE%E0%A7%80-%E0%A6%89%E0%A6%A4%E0%A7%8D%E0%A6%A4%E0%A6%B0%E0%A6%BE%E0%A6%A7%E0%A6%BF%E0%A6%95%E0%A6%BE%E0%A6%B0-%E0%A7%A8' -o /tmp/page.html
          gzip -n -9 < /tmp/page.html > .source-probe/sample.html.gz
          git config user.name github-actions\[bot\]
          git config user.email 41898282+github-actions\[bot\]@users.noreply.github.com
          git add .source-probe/sample.html.gz
          git commit -m 'Temporary source page sample'
          git push origin HEAD:${{ github.ref_name }}
