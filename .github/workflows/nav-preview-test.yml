name: Temporary navigation browser test
on:
  push:
    branches: [arena/c3705d11-dawah-x]
    paths: ['style.css', 'tools/nav-preview-test.cjs', '.github/workflows/nav-preview-test.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix /tmp/navtest playwright-core
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/nav-http.log 2>&1 &
          NODE_PATH=/tmp/navtest/node_modules node tools/nav-preview-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-screenshots
          path: /tmp/navshots/
          if-no-files-found: ignore
