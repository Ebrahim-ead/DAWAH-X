name: Collect rendered iHadis chapters
on:
  push:
    branches: ['arena/983d824f-dawah-x']
    paths: ['.github/workflows/ihadis-browser-temporary.yml']
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/983d824f-dawah-x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix /tmp/ihadis-browser playwright-core@1.56.1 cheerio@1.0.0 --no-audit --no-fund
      - run: NODE_PATH=/tmp/ihadis-browser/node_modules node tools/ihadis-remaining-probe.cjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/ihadis-probe-*.html
          git commit -m 'Record remaining source card diagnostics' && git push origin HEAD:arena/983d824f-dawah-x
