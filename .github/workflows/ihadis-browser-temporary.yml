name: Collect rendered iHadis chapters
on:
  push:
    branches: ['arena/983d824f-dawah-x']
    paths: ['.github/workflows/ihadis-browser-temporary.yml']
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/983d824f-dawah-x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix /tmp/ihadis-browser playwright-core@1.56.1 cheerio@1.0.0 --no-audit --no-fund
      - name: Collect and checkpoint complete books
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for book in fazayele-amal sahih-hadise-qudsi targib-wattahrib; do
            status=0
            NODE_PATH=/tmp/ihadis-browser/node_modules node tools/collect-ihadis-browser.cjs "$book" || status=$?
            git add tools/ihadis-*-snapshot.json.gz tools/ihadis-collection-report.json
            git commit -m "Record collection result for $book" && git push origin HEAD:arena/983d824f-dawah-x
            if [ "$status" -ne 0 ]; then exit "$status"; fi
          done

# Fall back to individual pages for a small number of unrendered cards.
