name: Inspect iHadis public pages
on:
  push:
    branches: ['arena/571b6185-dawah-x']
    paths: ['.github/workflows/ihadis-source-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/571b6185-dawah-x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install parser
        run: npm install --prefix /tmp/ihadis-parser cheerio@1.0.0 --no-audit --no-fund
      - name: Collect public source pages gently
        run: NODE_PATH=/tmp/ihadis-parser/node_modules node tools/collect-ihadis.cjs
      - name: Save results on this session branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/ihadis-*-snapshot.json.gz tools/ihadis-collection-report.json 2>/dev/null || git add tools/ihadis-collection-report.json
          git commit -m 'Inspect iHadis source response for import' && git push origin HEAD:arena/571b6185-dawah-x
