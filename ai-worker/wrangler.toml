name = "dawahx-assistant"
main = "worker.mjs"
compatibility_date = "2025-04-01"

[ai]
binding = "AI"

# Worker rate limits are per Cloudflare location, not a global spending cap.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Independent, per-location protection for KV writes; not a global daily cap.
[[ratelimits]]
name = "UNANSWERED_LIMITER"
namespace_id = "1003"
simple = { limit = 1, period = 60 }

# Dedicated production namespace; previews remain unbound.
# See ai-worker/unanswered-setup.md for privacy and operational controls.
[[kv_namespaces]]
binding = "UNANSWERED_QUESTIONS"
id = "c2a366fb051244d5a21878990e62458d"

[vars]
ALLOWED_ORIGINS = "https://ebrahim-ead.github.io"

# Preview settings do not inherit production bindings. Use an isolated rate
# limit namespace; AI inference still uses the account's Workers AI quota.
[previews.ai]
binding = "AI"

[[previews.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[previews.ratelimits]]
name = "UNANSWERED_LIMITER"
namespace_id = "1004"
simple = { limit = 1, period = 60 }

[previews.vars]
ALLOWED_ORIGINS = "https://ebrahim-ead.github.io"
