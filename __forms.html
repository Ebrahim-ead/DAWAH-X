<!-- Registers the question form with Netlify Forms; the visible form lives on every page and posts here via fetch. -->
<form name="question" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="question"/>
  <input name="name"/>
  <input name="contact"/>
  <input name="topic"/>
  <input name="religion"/>
  <textarea name="question"></textarea>
  <input name="bot-field"/>
</form>
